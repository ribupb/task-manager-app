<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body">

            <h2>Edit Task</h2>

            <form method="POST">

                <input type="text"
                       name="title"
                       class="form-control mb-3"
                       value="{{ task[2] }}"
                       required>

                <textarea
                    name="description"
                    class="form-control mb-3">{{ task[3] }}</textarea>

                <button class="btn btn-success">
                    Update Task
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
